<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Navbar with tailwind</title>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

    <nav class="bg-white shadow-sm">
        <div class="mx-auto flex max-w-7xl item-center justify-between px-6 py-7">
            <a href="#home"
                class="rounded-lg text-2xl font-extrabold tracking-tight text-indigo-700 transition-colors hover:text-indigo-900 focus-visible:outline-2 focus-visible:outline-offset-4 focus:outline-indigo-600">
                Tailwind<span class="text-slate-900">Navbar</span>
            </a>

            <div class="hidden item-center gap-8 md:flex">
                <a href="#home"
                    class="rounded-md px-2 py-2 font-medium text-slate-600 transition-colors hover:bg-indigo-50 hover:indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Home
                </a>

                <a href="#about"
                    class="rounded-md px-2 py-2 font-medium text-slate-600 transition-colors hover:bg-indigo-50 hover:indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    About
                </a>

                <a href="#service"
                    class="rounded-md px-2 py-2 font-medium text-slate-600 transition-colors hover:bg-indigo-50 hover:indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Services
                </a>

                <a href="#contact"
                    class="rounded-md px-2 py-2 font-medium text-slate-600 transition-colors hover:bg-indigo-50 hover:indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Contact
                </a>

            </div>
            
        </div>
    </nav>
</body>

</html>
